<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StretchText</title>
  <style>
    :root { color-scheme: light dark; }
    body { width: 300px; margin: 0; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; background: #fff; color: #111; }
    header { padding: 14px 16px 6px; }
    h1 { font-size: 15px; margin: 0 0 2px; }
    p.sub { margin: 0; font-size: 11.5px; color: #6b7280; }
    .body { padding: 10px 16px 16px; display: grid; gap: 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .who { font-size: 12px; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; flex: 0 0 auto; }
    .dot.on { background: #10b981; }
    button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #d1d5db; background: #f9fafb; cursor: pointer; }
    button.primary { background: #5b21b6; border-color: #5b21b6; color: #fff; font-weight: 600; }
    button.primary[disabled] { opacity: .5; cursor: default; }
    a { color: #5b21b6; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>StretchText</h1>
    <p class="sub">Any page, grown where you want it.</p>
  </header>
  <div class="body">
    <div class="row">
      <span class="dot" id="dot"></span>
      <span class="who" id="who">Checking…</span>
    </div>
    <button class="primary" id="toggle" disabled>Stretch this page</button>
    <div class="row">
      <a href="#" id="options">Settings &amp; Pollen connection</a>
      <a href="https://pollinations.ai/?ref=badge" target="_blank" rel="noopener">Pollinations</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
